<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">GAURDX Node 2 and Node 3 data flow</title><desc id="desc">Environmental sensors feed Arduino Nano safety control, which streams JSON over USB serial to Flask. Node 1 sends access events to that server.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#4de0c1"/></marker><style>.box{fill:#111d2d;stroke:#4de0c1;stroke-width:2;rx:18}.title{fill:#f3f7fb;font:700 22px sans-serif}.text{fill:#c6d2df;font:16px sans-serif}.arrow{stroke:#4de0c1;stroke-width:3;marker-end:url(#arrow)}.small{fill:#8193a8;font:14px sans-serif}</style></defs><rect width="1200" height="520" rx="22" fill="#08111d"/><text x="48" y="55" class="title" font-size="28">GAURDX · Environment telemetry path</text><rect class="box" x="55" y="150" width="270" height="210"/><text class="title" x="82" y="190">Sensors + RTC</text><text class="text" x="82" y="230">DHT11 · MQ gas · flame</text><text class="text" x="82" y="260">Soil moisture · DS3231</text><text class="small" x="82" y="320">Sample every 2 seconds</text><rect class="box" x="465" y="115" width="300" height="280"/><text class="title" x="495" y="155">Node 2 · Arduino Nano</text><text class="text" x="495" y="200">Hazard? Open vent + alarm</text><text class="text" x="495" y="232">Hazard? Stop pump</text><text class="text" x="495" y="276">Dry soil? Pulse irrigation</text><text class="text" x="495" y="320">Emit one JSON line</text><text class="small" x="495" y="362">Local fail-safe runs on edge</text><rect class="box" x="900" y="150" width="250" height="210"/><text class="title" x="930" y="190">Node 3 · Flask</text><text class="text" x="930" y="230">Validate telemetry</text><text class="text" x="930" y="260">Append CSV logs</text><text class="text" x="930" y="290">REST API · port 5000</text><text class="small" x="930" y="330">/api/telemetry</text><path class="arrow" d="M325 255h130"/><path class="arrow" d="M765 255h125"/><text class="small" x="785" y="235">USB serial / POST</text><rect x="465" y="430" width="300" height="58" rx="12" fill="#14253a" stroke="#53677f"/><text class="text" x="490" y="466">Node 1 access · /api/access-log</text><path d="M765 458h260v-98" fill="none" stroke="#73859a" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/></svg>
