<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Arduino Nano Node 2 wiring map</title><desc id="desc">Pin map for DHT11, flame, relay, L298N, buzzer, MQ gas, soil sensor and DS3231.</desc><defs><style>.bg{fill:#08111d}.card{fill:#111d2d;stroke:#36516c;stroke-width:2;rx:16}.nano{fill:#17384a;stroke:#4de0c1;stroke-width:3;rx:24}.head{fill:#f2f6fb;font:700 25px sans-serif}.txt{fill:#d0dbe7;font:17px sans-serif}.pin{fill:#4de0c1;font:700 16px monospace}.wire{stroke:#4de0c1;stroke-width:2.5;fill:none}.note{fill:#a8b6c7;font:15px sans-serif}</style></defs><rect class="bg" width="1100" height="650"/><text class="head" x="40" y="48">Node 2 · Arduino Nano wiring reference</text><rect class="nano" x="430" y="130" width="240" height="405"/><text class="head" x="477" y="190">NANO</text><text class="pin" x="462" y="246">D2</text><text class="pin" x="462" y="286">D3</text><text class="pin" x="462" y="326">D4</text><text class="pin" x="462" y="366">D5</text><text class="pin" x="462" y="406">D6</text><text class="pin" x="462" y="446">D7</text><text class="pin" x="462" y="486">D8</text><text class="pin" x="585" y="246">A0</text><text class="pin" x="585" y="286">A1</text><text class="pin" x="585" y="326">A4</text><text class="pin" x="585" y="366">A5</text><rect class="card" x="55" y="130" width="265" height="100"/><text class="head" x="78" y="168">DHT11</text><text class="txt" x="78" y="201">DATA → D2 · VCC · GND</text><path class="wire" d="M320 180h100M430 240H370V180"/><rect class="card" x="55" y="265" width="265" height="100"/><text class="head" x="78" y="303">Flame module</text><text class="txt" x="78" y="336">DO → D3 · active LOW</text><path class="wire" d="M320 315h90v-29h20"/><rect class="card" x="55" y="400" width="265" height="100"/><text class="head" x="78" y="438">Relay + pump</text><text class="txt" x="78" y="471">IN → D4 · external pump supply</text><path class="wire" d="M320 450h90v-124h20"/><rect class="card" x="780" y="130" width="265" height="100"/><text class="head" x="803" y="168">MQ gas module</text><text class="txt" x="803" y="201">AO → A0 · ADC threshold</text><path class="wire" d="M670 240h70v-60h40"/><rect class="card" x="780" y="265" width="265" height="100"/><text class="head" x="803" y="303">Soil sensor</text><text class="txt" x="803" y="336">AO → A1 · calibrate range</text><path class="wire" d="M670 280h70v35h40"/><rect class="card" x="780" y="400" width="265" height="100"/><text class="head" x="803" y="438">DS3231 RTC</text><text class="txt" x="803" y="471">SDA → A4 · SCL → A5</text><path class="wire" d="M670 320h80v130h30M670 360h60v100h50"/><rect class="card" x="350" y="555" width="400" height="68"/><text class="txt" x="377" y="584">L298N: ENA D5 · IN1 D6 · IN2 D7</text><text class="txt" x="377" y="610">Buzzer signal → D8</text><path class="wire" d="M475 535v20M475 535v-129M475 406h-55M475 446h-55M475 486h-55"/><text class="note" x="40" y="640">Share ground. Use external power for pump/motor; never drive loads from Nano GPIO.</text></svg>
